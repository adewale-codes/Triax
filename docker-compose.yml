services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: triax
      POSTGRES_USER: triax
      POSTGRES_PASSWORD: triax
    ports:
      - "5433:5432"
    networks:
      - triax_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triax -d triax"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - triax_network

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/bash", "/scripts/pull_models.sh"]
    volumes:
      - ./scripts:/scripts
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - triax_network
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - triax_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - triax_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - triax_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks:
      - triax_network
    depends_on:
      - api

networks:
  triax_network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
