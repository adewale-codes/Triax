services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: triax
      POSTGRES_USER: triax
      POSTGRES_PASSWORD: triax
    ports:
      - "5433:5432"
    networks:
      - triax_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triax -d triax"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - triax_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - triax_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - triax_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - triax_network
    depends_on:
      - api

networks:
  triax_network:
    driver: bridge

volumes:
  postgres_data: